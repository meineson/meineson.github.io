<h1 id="视频原文"><a href="#视频原文" class="headerlink" title="视频原文"></a>视频原文</h1><figure class="highlight plaintext"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br><span class="line">10</span><br><span class="line">11</span><br><span class="line">12</span><br><span class="line">13</span><br><span class="line">14</span><br><span class="line">15</span><br><span class="line">16</span><br><span class="line">17</span><br><span class="line">18</span><br><span class="line">19</span><br><span class="line">20</span><br><span class="line">21</span><br><span class="line">22</span><br><span class="line">23</span><br><span class="line">24</span><br><span class="line">25</span><br><span class="line">26</span><br><span class="line">27</span><br><span class="line">28</span><br><span class="line">29</span><br><span class="line">30</span><br><span class="line">31</span><br><span class="line">32</span><br><span class="line">33</span><br><span class="line">34</span><br><span class="line">35</span><br><span class="line">36</span><br><span class="line">37</span><br><span class="line">38</span><br><span class="line">39</span><br><span class="line">40</span><br><span class="line">41</span><br><span class="line">42</span><br><span class="line">43</span><br><span class="line">44</span><br><span class="line">45</span><br></pre></td><td class="code"><pre><span class="line">今天MBTV用一个视频教程，快速介绍下制作AI剧的全部核心流程，这是可以扩展应用到任何长度的视频的制作经验，例如：MTV，广告短片，AI剧，AI电影，而不只是局限于做一段10几秒的玩具视频。</span><br><span class="line"></span><br><span class="line">先看成片，剧本中的第一场，9个分镜，三个人物出场。</span><br><span class="line"></span><br><span class="line">这个视频用的是MBTV原创的剧本，用来演示制作流程，非常简单，但基本涵盖了AI剧制作过程中的人物场景一致性，运镜和场景延续，台词、音效等全部元素，掌握了这些技能基本可以独立上手制作完整剧集了，有些特别基础的知识点和疑问，可以评论区留言问答。</span><br><span class="line"></span><br><span class="line">先看下全流程总览，可以看到原始输入就是一段小说剧本，最后输出是一段完整视频，下面我们细化讲解。</span><br><span class="line"></span><br><span class="line">第一步：会用AI依次生成角色提示词，场景提示词，并用AI文生图工具依次生成角色和场景图片。这个用国内的豆包、即梦，国外的ChatGPT和Gemini都可以免费完成。</span><br><span class="line"></span><br><span class="line">第二步：会用AI对原始小说或剧本进行分镜脚本的生成，这里网上也会有许多智能体或Skills可以用来辅助，下次可以单独细讲，我们只看下具体内容是这样的。</span><br><span class="line"></span><br><span class="line">里面主要是包含镜号，画面描述，出场人物，场景和音效台词等内容，也会给出推荐的摄影师用的景别/角度等运镜参考，可以参考，我们后续也是用AI辅助完成。</span><br><span class="line"></span><br><span class="line">第三步：分镜脚本变成可以生成分镜故事板的图片生成提示词，这里同样AI辅助，方法同上，这也是可以单独细讲的，我们今天学总体流程先不钻太细。</span><br><span class="line"></span><br><span class="line">一般会生成九宫格，所以会有9条提示词，我们看一下。</span><br><span class="line">生成的效果图是这样的。</span><br><span class="line"></span><br><span class="line">我们会从里面挑选你觉得符合剧情推进逻辑的一两张画面，你可以想象成这些图片是最后成片里的一个关键帧。</span><br><span class="line"></span><br><span class="line">第四步：有了故事板参考图片，我们就以来生成分镜视频了，专业术语叫SHOT，最后成片就是一个个SHOT拼接剪辑出来的，这叫粗剪出小样。</span><br><span class="line">对SHOT进行时长调整、转场效果，再加上人工配音、字幕，调整画面色彩就是精剪出成片了。</span><br><span class="line"></span><br><span class="line">用即梦、可灵这些图生视频平台时，一般做玩具视频时就是用的”一句话生成某某视频“的方法，你控制不了画面效果，换平台时效果会完全不同。</span><br><span class="line">而专业制作流程，需要保证导演设计时的效果，不管用哪家的平台生成的视频效果都要一样，这才能符合影视行业的工业级标准。</span><br><span class="line"></span><br><span class="line">回到流程图中。</span><br><span class="line"></span><br><span class="line">我们一般会用的是首尾帧，或者全能参考生成模式，我们会根据分镜剧情，描述上面选中的静态图片是如何变成视频的，这就是SHOT视频生成提示词，我们看下提示词。</span><br><span class="line"></span><br><span class="line">提示词里面会包括一些摄影的专业知识，这个同样需要深挖单独研究，下次再讲。</span><br><span class="line"></span><br><span class="line">提示词里一般还会加台词和音效描写，哪怕后期是真人配音，这里可以用让视频中人物对口型，所以提示词里也是需要的。</span><br><span class="line"></span><br><span class="line">基本上目前主流的视频生成平台都支持全能参考或首尾帧模式了，输入的就是这个分镜的出场人物的角色设定参考图、故事场景的设定参考图、故事板参考图，加上视频生成提示词，就可以得到视频了。</span><br><span class="line"></span><br><span class="line">要注意的是，基本上不可能做到一次过的，生成的视频里会有各种穿帮和错误，可以都保存下来，后面剪辑，把能用的剪出来。</span><br><span class="line">当然你是土豪随便多生成几个，挑一个最好的用。</span><br><span class="line"></span><br><span class="line">第五步，也是最后一步。一般用剪映，iMoive这些简单剪辑软件，把上面所有SHOT视频片段都拉进去剪辑出来，就是成片了，丰简由人，好的剪辑师，混乱的素材也是可以剪出好片的。</span><br><span class="line"></span><br><span class="line">这一方面需要人的经验，特别是人的审美，目前AI干的效果还不太好，但在进步。</span><br><span class="line"></span><br><span class="line">本期教程就到这里，有问题可以评论区留言，再见。</span><br></pre></td></tr></table></figure>
